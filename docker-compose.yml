services:
  web:
    build: .
    container_name: paws_care_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=secret123
      - DB_NAME=dokter_hewan
      - DB_PORT=3306
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: paws_care_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret123
      MYSQL_DATABASE: dokter_hewan
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -psecret123 || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mariadb_data:
